# Servizio dello zaino (piano pm/piano-2026-11-quaderno.md, fase Q4).
name = "pdb-zaino"
main = "src/index.ts"
compatibility_date = "2026-10-30"

# Solo il dominio suo: niente *.workers.dev né URL di anteprima.
workers_dev = false
preview_urls = false
routes = [{ pattern = "zaino.rainbowbits.cloud", custom_domain = true }]

# Log spenti: il servizio non registra richieste né indirizzi.
logpush = false
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "pdb-zaino"
# Da `npx wrangler d1 create pdb-zaino` (2026-11-16, regione EEUR).
database_id = "d81c8579-e24f-4add-ac6e-5d7b0d0a3ffd"
migrations_dir = "migrations"

# 300 richieste al minuto per IP e per sede di Cloudflare: una classe dietro lo
# stesso indirizzo della scuola ci sta, uno script che martella no.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Ogni giorno alle 03:17 UTC: via gli zaini fermi da 18 mesi.
[triggers]
crons = ["17 3 * * *"]
