name: Test deployment

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            slides/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Install slides dependencies
        run: npm ci --prefix slides
      - name: Install Chromium for the slide verification
        run: npx --prefix slides playwright install --with-deps chromium
      - name: Build slides
        run: npm run slides:build
      - name: Verify slides (nessuna slide che straborda)
        run: npm run slides:verifica
      - name: Guardia manifest percorsi (append-only)
        run: npm run curriculum:check
      - name: Lint
        run: npm run lint
      - name: Test build website
        run: npm run build